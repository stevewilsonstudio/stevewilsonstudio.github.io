  <style>
    body{
      margin: 0;
      background: #ffffff;
      color: #111;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .top{
      max-width: 1200px;
      margin: 26px auto 0;
      padding: 0 20px;
    }

    .brand{
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 44px;
      margin: 0;
      line-height: 1;
    }

    .tag{
      margin: 6px 0 18px;
      font-size: 13px;
      color: #666;
    }

    .nav{
      display: flex;
      flex-wrap: wrap;
      gap: 18px 22px;
      padding: 10px 0 18px;
      border-bottom: 1px solid #eee;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .nav a{
      text-decoration: none;
      color: #7a7a7a;
      text-transform: lowercase;
      letter-spacing: .12em;
      padding-bottom: 2px;
    }
    .nav a.active{
      color: #111;
      font-weight: 500;
    }
    .nav a:hover{ color:#111; }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* Masonry using columns (simple + reliable) */
    .masonry{
      column-count: 3;
      column-gap: 18px;
    }
    @media (max-width: 1000px){ .masonry{ column-count: 2; } }
    @media (max-width: 640px){ .masonry{ column-count: 1; } }

    figure{
      break-inside: avoid;
      margin: 0 0 18px;
    }

    img{
      width: 100%;
      height: auto;
      display: block;
      /* sharp corners everywhere */
      border-radius: 0;
    }

    figcaption{
      padding-top: 10px;
    }

    .title{
      font-size: 16px;
      margin: 0;
      font-weight: 500;
      color: #b97500; /* warm yellow-orange */
    }
    .meta{
      margin: 4px 0 0;
      font-size: 13px;
      color: #555;
    }

    .footer{
      max-width: 1200px;
      margin: 24px auto 0;
      padding: 0 20px 22px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>
