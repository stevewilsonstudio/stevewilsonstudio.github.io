<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Paintings — Steve Wilson</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #ffffff;
      --text: #111;
      --muted: rgba(17,17,17,.62);
      --muted2: rgba(17,17,17,.45);
      --hairline: rgba(17,17,17,.12);
      --sold-red: #b21f24;
    }

    *{
      box-sizing: border-box;
    }

    body{
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .wrap{
      width: min(1120px, 92vw);
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    header{
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--hairline);
    }

    .brand{
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .brand a{
      text-decoration: none;
      color: var(--text);
    }

    .name{
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 34px;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .sub{
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.10em;
      text-transform: lowercase;
      font-size: 13px;
    }

    nav{
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 2px;
    }

    nav a{
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      padding: 6px 0;
      border-bottom: 1px solid transparent;
    }

    nav a:hover{
      color: var(--text);
      border-bottom-color: rgba(17,17,17,.25);
    }

    nav a.active{
      color: var(--text);
      border-bottom-color: rgba(17,17,17,.35);
    }

    h1{
      margin: 22px 0 14px;
      font-size: 16px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--muted);
    }

    .grid{
      column-count: 3;
      column-gap: 16px;
    }

    @media (max-width: 980px){
      .grid{
        column-count: 2;
      }
    }

    @media (max-width: 620px){
      .grid{
        column-count: 1;
      }

      header{
        align-items: flex-start;
        flex-direction: column;
      }

      nav{
        justify-content: flex-start;
      }
    }

    .card{
      break-inside: avoid;
      margin: 0 0 16px 0;
    }

    .card a{
      text-decoration: none;
      color: inherit;
    }

    .imageWrap{
      position: relative;
      display: block;
    }

    .thumb{
      display: block;
      width: 100%;
      height: auto;
      border-radius: 0;
    }

    .soldDot{
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--sold-red);
      border: 2px solid rgba(255,255,255,.95);
      box-shadow: 0 1px 5px rgba(0,0,0,.35);
      z-index: 2;
      pointer-events: none;
    }

    .meta{
      padding-top: 8px;
      padding-bottom: 2px;
    }

    .titleRow{
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .title{
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.01em;
      margin: 0;
    }

    .status{
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .details{
      margin: 2px 0 0 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 300;
    }

    .price{
      margin: 2px 0 0 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 400;
    }

    footer{
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--hairline);
      color: var(--muted2);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    footer a{
      color: var(--muted2);
      text-decoration: none;
    }

    footer a:hover{
      color: var(--text);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <a href="index.html" aria-label="Home">
          <div class="name">Steve Wilson</div>
        </a>
        <div class="sub">original paintings</div>
      </div>

      <nav aria-label="Primary navigation">
        <a class="active" href="paintings.html">paintings</a>
        <a href="prints.html">prints &amp; commissions</a>
        <a href="exhibitions.html">exhibitions</a>
        <a href="galleries.html">galleries</a>
        <a href="about.html">about</a>
        <a href="contact.html">contact</a>
      </nav>
    </header>

    <h1>Paintings</h1>

    <section class="grid" id="grid" aria-label="Paintings grid"></section>

    <footer>
      <div>© Steve Wilson Studio</div>
      <div>
        <a href="mailto:stevenrwilson7@icloud.com">
          stevenrwilson7@icloud.com
        </a>
      </div>
    </footer>
  </div>

  <script src="data.js"></script>

  <script>
    const grid = document.getElementById("grid");

    function escapeHtml(value){
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    if (!Array.isArray(window.PAINTINGS)){
      grid.innerHTML = "<p>Paintings are temporarily unavailable.</p>";
    } else {
      grid.innerHTML = window.PAINTINGS.map(painting => {
        let statusLabel = "available";

        if (painting.status === "sold"){
          statusLabel = "sold";
        } else if (painting.status === "commission"){
          statusLabel = "private commission";
        } else if (painting.status === "unavailable"){
          statusLabel = "unavailable";
        }

        const details = `${
          painting.size
            ? escapeHtml(painting.size) + " · "
            : ""
        }${escapeHtml(painting.medium || "")}`.trim();

        const price =
          painting.status === "available" &&
          typeof painting.price === "number"
            ? `<p class="price">${escapeHtml(formatUSD(painting.price))}</p>`
            : "";

        const soldDot =
          painting.status === "sold"
            ? `<span
                class="soldDot"
                role="img"
                aria-label="Sold"
                title="Sold"
              ></span>`
            : "";

        return `
          <article class="card">
            <a
              href="viewer.html?slug=${encodeURIComponent(painting.slug)}"
              aria-label="${escapeHtml(painting.title)}"
            >
              <div class="imageWrap">
                <img
                  class="thumb"
                  src="${escapeHtml(painting.file)}"
                  alt="${escapeHtml(painting.title)}"
                  loading="lazy"
                >
                ${soldDot}
              </div>

              <div class="meta">
                <div class="titleRow">
                  <h2 class="title">${escapeHtml(painting.title)}</h2>
                  <div class="status">${escapeHtml(statusLabel)}</div>
                </div>

                <p class="details">${details}</p>
                ${price}
              </div>
            </a>
          </article>
        `;
      }).join("");
    }
  </script>
</body>
</html>
