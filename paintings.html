<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Paintings — Steve Wilson</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #ffffff;
      --text: #111;
      --muted: rgba(17,17,17,.62);
      --muted2: rgba(17,17,17,.45);
      --hairline: rgba(17,17,17,.12);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .wrap{
      width:min(1120px, 92vw);
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--hairline);
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap: 6px;
    }
    .brand a{
      text-decoration:none;
      color: var(--text);
    }
    .name{
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 34px;
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .sub{
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.10em;
      text-transform: lowercase;
      font-size: 13px;
    }

    nav{
      display:flex;
      flex-wrap:wrap;
      gap: 18px;
      align-items:center;
      justify-content:flex-end;
      padding-bottom: 2px;
    }
    nav a{
      text-decoration:none;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      padding: 6px 0;
      border-bottom: 1px solid transparent;
    }
    nav a:hover { color: var(--text); border-bottom-color: rgba(17,17,17,.25); }
    nav a.active { color: var(--text); border-bottom-color: rgba(17,17,17,.35); }

    .toprow{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap: 18px;
      margin-top: 22px;
      margin-bottom: 14px;
    }
    h1{
      margin:0;
      font-size: 16px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--muted);
    }
    .tools{
      display:flex;
      gap: 10px;
      align-items:center;
      color: var(--muted2);
      font-size: 13px;
    }
    .toolbtn{
      border: 1px solid rgba(17,17,17,.18);
      background: transparent;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--muted);
    }
    .toolbtn:hover{ border-color: rgba(17,17,17,.28); color: var(--text); }

    /* Masonry-ish columns without huge gaps */
    .grid{
      column-count: 3;
      column-gap: 16px;
    }
    @media (max-width: 980px){ .grid{ column-count: 2; } }
    @media (max-width: 620px){ .grid{ column-count: 1; } }

    .card{
      break-inside: avoid;
      margin: 0 0 16px 0;
    }
    .thumb{
      display:block;
      width:100%;
      height:auto;
      border-radius: 0; /* sharp corners */
    }
    .card a{
      text-decoration:none;
      color: inherit;
    }

    .meta{
      padding-top: 8px;
      padding-bottom: 2px;
    }
    .titleRow{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 10px;
    }
    .title{
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.01em;
      margin: 0;
    }
    .status{
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .details{
      margin: 2px 0 0 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 300;
    }
    .price{
      margin: 2px 0 0 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 400;
    }

    footer{
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--hairline);
      color: var(--muted2);
      font-size: 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 12px;
    }
    footer a{ color: var(--muted2); text-decoration:none; }
    footer a:hover{ color: var(--text); }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <a href="index.html" aria-label="Home">
          <div class="name">Steve Wilson</div>
        </a>
        <div class="sub">original paintings</div>
      </div>

      <nav aria-label="Primary navigation">
        <a class="active" href="paintings.html">paintings</a>
        <a href="prints.html">prints &amp; commissions</a>
        <a href="exhibitions.html">exhibitions</a>
        <a href="galleries.html">galleries</a>
        <a href="about.html">about</a>
        <a href="contact.html">contact</a>
      </nav>
    </header>

    <div class="toprow">
      <h1>Paintings</h1>
      <div class="tools">
        <span>Prices: <strong id="priceState"></strong></span>
        <button class="toolbtn" type="button" onclick="togglePrices()">Toggle prices</button>
      </div>
    </div>

    <section class="grid" id="grid" aria-label="Paintings grid"></section>

    <footer>
      <div>© Steve Wilson Studio</div>
      <div><a href="mailto:stevenrwilson7@icloud.com">stevenrwilson7@icloud.com</a></div>
    </footer>
  </div>

  <script src="data.js"></script>
  <script>
    const grid = document.getElementById("grid");
    const priceState = document.getElementById("priceState");
    priceState.textContent = window.SHOW_PRICES ? "on" : "off";

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function render(){
      grid.innerHTML = window.PAINTINGS.map(p => {
        const statusLabel = p.status === "sold" ? "sold" : "available";
        const details = `${p.size ? escapeHtml(p.size) + " · " : ""}${escapeHtml(p.medium || "")}`.trim();
        const price = (window.SHOW_PRICES && p.status === "available" && typeof p.price === "number")
          ? `<p class="price">${escapeHtml(formatUSD(p.price))}</p>`
          : ``;

        return `
          <article class="card">
            <a href="viewer.html?slug=${encodeURIComponent(p.slug)}" aria-label="${escapeHtml(p.title)}">
              <img class="thumb" src="${escapeHtml(p.file)}" alt="${escapeHtml(p.title)}" loading="lazy">
              <div class="meta">
                <div class="titleRow">
                  <h2 class="title">${escapeHtml(p.title)}</h2>
                  <div class="status">${escapeHtml(statusLabel)}</div>
                </div>
                <p class="details">${details}</p>
                ${price}
              </div>
            </a>
          </article>
        `;
      }).join("");
    }
    render();
  </script>
</body>
</html>
