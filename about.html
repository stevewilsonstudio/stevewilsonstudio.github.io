<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About — Steve Wilson Studio</title>
  <meta name="description" content="About Steve Wilson Studio." />

  <style>
    :root{
      --bg:#0f1115;
      --text:#f2f4f8;
      --muted:#b9c0cf;
      --line:rgba(255,255,255,0.12);
      --card:rgba(20,24,36,0.70);
      --max:960px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(90,160,255,0.18), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(255,208,140,0.12), transparent 55%),
        var(--bg);
      line-height:1.65;
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:var(--max); margin:0 auto; padding:28px 18px 64px}

    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      padding-bottom:18px;
    }
    .brandLink{display:inline-block}
    .brandName{
      margin:0;
      line-height:1.0;
      font-weight:800;
      letter-spacing:0.2px;
      font-size:56px;
      background: linear-gradient(90deg,
        rgba(120,190,255,1) 0%,
        rgba(225,245,255,0.98) 50%,
        rgba(255,226,170,0.98) 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .brandTag{
      margin:6px 0 0;
      font-size:14px;
      color:var(--muted);
    }

    nav{display:flex; gap:10px; flex-wrap:wrap; padding-bottom:3px}
