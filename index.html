<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steve Wilson Studio</title>

  <!-- Classic high-contrast serif italic (free Google font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --overlay: rgba(0,0,0,.42);
      --menuText: rgba(255,255,255,.92);
      --menuTextSoft: rgba(255,255,255,.78);
      --linkHover: rgba(255,255,255,1);
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; margin:0; }
    body{
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#000;
      overflow:hidden;
    }

    /* Fullscreen background slideshow */
    .hero{
      position:relative;
      height:100vh;
      width:100%;
      background:#000;
    }

    .bg{
      position:absolute;
      inset:0;
      z-index:0;
      overflow:hidden;
      background:#000;
    }

    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.30) 45%, rgba(0,0,0,.22) 100%);
      pointer-events:none;
    }

    .bg-slide{
      position:absolute;
      inset:0;
      background-size: cover;
      background-position: center;
      opacity:0;
      transition: opacity 1400ms ease-in-out;
      transform: scale(1.03);
    }
    .bg-slide.active{
      opacity:1;
    }

    /* Left panel content */
    .panel{
      position:relative;
      z-index:2;
      height:100%;
      display:flex;
      align-items:center;       /* centers vertically */
      padding-left: clamp(18px, 4vw, 56px);
      padding-right: 16px;
    }

    .panel-inner{
      width:min(520px, 82vw);
      transform: translateY(8vh); /* push down so name isn't cut off (Svob-ish) */
    }

    .name{
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 500;
      color: var(--menuText);
      font-size: clamp(52px, 7.2vw, 92px);
      line-height: .92;
      letter-spacing: 0.02em;  /* slightly spaced like Svob */
      margin:0 0 10px 0;
      text-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    .tagline{
      color: var(--menuTextSoft);
      font-size: 15px;
      letter-spacing: 0.02em;
      margin:0 0 22px 0;
      text-shadow: 0 10px 24px rgba(0,0,0,.35);
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap: 14px;                 /* extra space between lines */
      margin-top: 10px;
    }

    .nav a{
      color: var(--menuTextSoft);
      text-decoration:none;
      font-size: 14px;
      letter-spacing: 0.28em;    /* spaced letters like Svob */
      text-transform: uppercase;
      width: fit-content;
    }
    .nav a:hover{
      color: var(--linkHover);
    }

    .icons{
      display:flex;
      gap: 14px;
      margin-top: 22px;
      align-items:center;
    }
    .icon{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width: 28px;              /* larger icons */
      height: 28px;
      opacity: .9;
      transition: opacity .15s ease;
    }
    .icon:hover{ opacity:1; }

    .icon svg{
      width: 28px;
      height: 28px;
      fill: rgba(255,255,255,.92);
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.35));
    }

    /* Small footer */
    .footer{
      position:absolute;
      left: clamp(18px, 4vw, 56px);
      bottom: 18px;
      z-index:3;
      color: rgba(255,255,255,.65);
      font-size: 12px;
      letter-spacing: 0.03em;
      text-shadow: 0 10px 22px rgba(0,0,0,.35);
    }

    /* Mobile adjustments */
    @media (max-width: 520px){
      body{ overflow:hidden; }
      .panel-inner{ transform: translateY(6vh); }
      .nav{ gap: 12px; }
      .tagline{ font-size: 14px; }
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="bg" aria-hidden="true">
      <!-- FIRST IMAGE should be Studio.jpg -->
      <div class="bg-slide active" style="background-image:url('Studio.jpg')"></div>

      <!-- Rotation images -->
      <div class="bg-slide" style="background-image:url('Cumberland.jpg')"></div>
      <div class="bg-slide" style="background-image:url('Breckenridge.jpg')"></div>
      <div class="bg-slide" style="background-image:url('Keeneland.jpg')"></div>
    </div>

    <section class="panel">
      <div class="panel-inner">
        <h1 class="name">Steve Wilson</h1>
        <p class="tagline">Welcome to my studio website.</p>

        <nav class="nav" aria-label="Site">
          <a href="paintings.html">Paintings</a>
          <a href="prints.html">Prints</a>
          <a href="workshops.html">Workshops &amp; Exhibitions</a>
          <a href="galleries.html">Galleries</a>
          <a href="about.html">About</a>
        </nav>

        <div class="icons" aria-label="Social links">
          <!-- Instagram -->
          <a class="icon" href="https://www.instagram.com/steven_wilson_fine_art/" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm9 2h-9A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9A3.5 3.5 0 0 0 20 16.5v-9A3.5 3.5 0 0 0 16.5 4zm.75 2.25a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </a>

          <!-- Mail -->
          <a class="icon" href="mailto:stevenrwilson7@icloud.com" aria-label="Email">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/>
            </svg>
          </a>

          <!-- Facebook -->
          <a class="icon" href="https://www.facebook.com/search/top?q=steven%20wilson%20art" target="_blank" rel="noopener" aria-label="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13.5 22v-8h2.7l.4-3h-3.1V9.2c0-.9.3-1.6 1.6-1.6H16.7V5a22 22 0 0 0-2.4-.1c-2.4 0-4 1.5-4 4.1V11H7.7v3h2.6v8h3.2z"/>
            </svg>
          </a>
        </div>
      </div>
    </section>

    <div class="footer">© Steve Wilson Studio</div>
  </main>

  <script>
    // Background cross-fade slideshow
    const slides = Array.from(document.querySelectorAll(".bg-slide"));
    let i = 0;

    // Ensure first slide is active (Studio.jpg)
    slides.forEach((s, idx) => s.classList.toggle("active", idx === 0));

    setInterval(() => {
      slides[i].classList.remove("active");
      i = (i + 1) % slides.length;
      slides[i].classList.add("active");
    }, 6500); // seconds per image
  </script>
</body>
</html>
