<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steve Wilson Studio</title>
  <meta name="description" content="Steve Wilson Studio — original paintings & fine art prints." />

  <!-- Elegant serif similar vibe to Svob -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f1115;
      --text:#f2f4f8;
      --muted:rgba(255,255,255,0.72);
      --line:rgba(255,255,255,0.14);

      --coolA: rgba(120,190,255,1);
      --coolB: rgba(235,248,255,0.98);
      --warm: rgba(255,210,125,1);

      --grad: linear-gradient(90deg, var(--coolA) 0%, var(--coolB) 55%, var(--warm) 100%);
      --radius: 0px; /* ✅ sharp corners everywhere */
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      overflow-x:hidden;
    }

    a{color:inherit; text-decoration:none}

    /* HERO / BACKGROUND SLIDESHOW */
    .hero{
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 18px;
    }

    .slides{
      position:absolute;
      inset:0;
      z-index:0;
      overflow:hidden;
    }

    .slide{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      opacity:0;
      transition: opacity 1.6s ease-in-out;
      transform: scale(1.02);
    }
    .slide.active{opacity:1}

    /* Dim overlay so text pops */
    .overlay{
      position:absolute;
      inset:0;
      z-index:1;
      background:
        radial-gradient(900px 520px at 20% 20%, rgba(0,0,0,0.18), transparent 55%),
        linear-gradient(180deg, rgba(0,0,0,0.50) 0%, rgba(0,0,0,0.58) 55%, rgba(0,0,0,0.68) 100%);
    }

    /* TOP BAR */
    .topbar{
      position:absolute;
      top:0; left:0; right:0;
      z-index:3;
      padding:18px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .brand a{
      display:inline-block;
      font-family:"Libre Bodoni", serif;
      font-size:56px;
      letter-spacing:0.5px;
      line-height:1;
      color:rgba(255,255,255,0.98);
      text-shadow: 0 6px 22px rgba(0,0,0,0.35);
    }

    nav{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    nav a{
      font-size:14px;
      color:rgba(255,255,255,0.82);
      padding:8px 10px;
      border:1px solid transparent;
      border-radius: var(--radius);
      backdrop-filter: blur(6px);
    }
    nav a:hover{
      border-color: var(--line);
      background: rgba(255,255,255,0.06);
    }

    /* CENTER COPY */
    .center{
      position:relative;
      z-index:2;
      width:min(1100px, 100%);
      padding-top:56px;
    }

    .tagline{
      margin:0;
      font-size:18px;
      color:rgba(255,255,255,0.82);
      letter-spacing:0.2px;
      text-shadow: 0 6px 22px rgba(0,0,0,0.35);
      max-width: 52ch;
    }

    .subtag{
      margin:14px 0 0;
      font-size:16px;
      color:rgba(255,255,255,0.72);
      max-width: 62ch;
      text-shadow: 0 6px 22px rgba(0,0,0,0.35);
    }

    .accentWarm{ color: var(--warm); font-weight:700; }

    /* CONTACT SECTION (simple anchor target) */
    .contactWrap{
      position:relative;
      z-index:2;
      margin-top:22px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      border:1px solid var(--line);
      background: rgba(0,0,0,0.28);
      padding:10px 12px;
      border-radius: var(--radius);
      color:rgba(255,255,255,0.84);
      font-size:14px;
      backdrop-filter: blur(6px);
    }
    .pill:hover{ background: rgba(0,0,0,0.36); }

    /* Small footer-ish hint */
    .corner{
      position:absolute;
      bottom:18px;
      left:22px;
      z-index:3;
      font-size:12px;
      color:rgba(255,255,255,0.58);
      letter-spacing:0.2px;
    }

    @media (max-width: 900px){
      .brand a{font-size:40px}
      .topbar{padding:14px 14px}
      nav{gap:8px}
      .tagline{font-size:16px}
      .subtag{font-size:15px}
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="slides" aria-hidden="true">
      <div class="slide active" style="background-image:url('Cumberland.jpg')"></div>
      <div class="slide" style="background-image:url('Sailboats.jpg')"></div>
      <div class="slide" style="background-image:url('Breckenridge.jpg')"></div>
      <div class="slide" style="background-image:url('Cashiers.jpg')"></div>
    </div>
    <div class="overlay" aria-hidden="true"></div>

    <div class="topbar">
      <div class="brand">
        <a href="index.html" aria-label="Home">Steve Wilson</a>
      </div>

      <nav aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="paintings.html">Paintings</a>
        <a href="prints.html">Prints</a>
        <a href="about.html">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>

    <section class="center">
      <p class="tagline">
        Steve Wilson Studio
      </p>
      <p class="subtag">
        <span class="accentWarm">Paintings shaped by light, place, and the fleeting beauty found in everyday life.</span>
      </p>

      <div class="contactWrap" id="contact">
        <a class="pill" href="mailto:stevenrwilson7@icloud.com">stevenrwilson7@icloud.com</a>
        <a class="pill" href="paintings.html">View Paintings</a>
        <a class="pill" href="prints.html">Prints</a>
      </div>
    </section>

    <div class="corner">© Steve Wilson Studio</div>
  </main>

  <script>
    // Simple crossfade slideshow
    const slides = Array.from(document.querySelectorAll('.slide'));
    let i = 0;
    const intervalMs = 6500;

    setInterval(() => {
      slides[i].classList.remove('active');
      i = (i + 1) % slides.length;
      slides[i].classList.add('active');
    }, intervalMs);
  </script>
</body>
</html>
