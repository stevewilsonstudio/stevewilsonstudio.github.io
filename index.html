<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steve Wilson Studio</title>

  <!-- Sleek Didot/Bodoni-like serif + clean sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,200;6..96,300;6..96,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b1220;
      --text:#ffffff;
      --muted:rgba(255,255,255,0.75);
      --muted2:rgba(255,255,255,0.58);

      /* overall dimming on background */
      --dim:0.55;

      /* spacing */
      --pad:56px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      overflow:hidden;
      background:#000;
    }

    /* Background slideshow */
    .bg{
      position:fixed;
      inset:0;
      z-index:-2;
      overflow:hidden;
      background:#000;
    }
    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(0,0,0,var(--dim));
      z-index:2;
    }

    .slide{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      opacity:0;
      transition: opacity 1300ms ease;
      transform: scale(1.03);
      z-index:1;
    }
    .slide.active{opacity:1}

    /* Left content block */
    .content{
      position:relative;
      height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      padding: var(--pad);
    }

    /* This is the key: we place the block lower, Svob-style */
    .panel{
      max-width: 520px;
      margin-top: 32vh; /* <- moves text down */
    }

    .name{
      margin:0 0 10px 0;
      font-family: "Bodoni Moda", serif;
      font-style: italic;
      font-weight: 300;          /* <- unbold + svelte */
      font-size: clamp(58px, 6vw, 96px);
      line-height: 0.95;
      letter-spacing: 0.02em;    /* <- subtle tracking like Svob */
      text-rendering: geometricPrecision;
    }

    .welcome{
      margin: 0 0 26px 2px;
      font-size: 16px;
      color: var(--muted);
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap: 14px;
      margin: 0 0 26px 2px;
      padding:0;
      list-style:none;
    }

    .nav a{
      display:inline-block;
      font-size: 14px;
      letter-spacing: 0.18em;    /* <- the Svob “spaced” look */
      text-transform: uppercase;
      color: rgba(255,255,255,0.88);
      text-decoration:none;
    }

    .nav a:hover{
      color: rgba(255,255,255,1);
    }

    .icons{
      display:flex;
      gap: 14px;
      align-items:center;
      margin-left: 2px;
    }

    .icon{
      width: 22px;
      height: 22px;
      display:inline-block;
      opacity: 0.9;
    }
    .icon:hover{opacity:1}

    /* Simple svg icons inherit color */
    svg{fill:none; stroke:rgba(255,255,255,0.92); stroke-width:1.8}

    /* Responsive tweaks */
    @media (max-width: 700px){
      :root{ --pad: 26px; }
      body{overflow:auto}
      .content{min-height:100vh; overflow:hidden}
      .panel{margin-top: 30vh;}
      .nav a{letter-spacing: 0.16em;}
    }

    @media (max-height: 650px){
      .panel{margin-top: 24vh;}
    }
  </style>
</head>

<body>
  <!-- Background slideshow -->
  <div class="bg" aria-hidden="true">
    <!-- Use only these three images per your request -->
    <div class="slide active" style="background-image:url('Cumberland.jpg');"></div>
    <div class="slide" style="background-image:url('Breckenridge.jpg');"></div>
    <div class="slide" style="background-image:url('Keeneland.jpg');"></div>
  </div>

  <main class="content">
    <section class="panel" aria-label="Homepage navigation">
      <h1 class="name">Steve<br>Wilson</h1>
      <p class="welcome">Welcome to my studio website.</p>

      <ul class="nav">
        <li><a href="paintings.html">Paintings</a></li>
        <li><a href="prints.html">Prints</a></li>
        <li><a href="workshops.html">Workshops &amp; Exhibitions</a></li>
        <li><a href="galleries.html">Galleries</a></li>
        <li><a href="about.html">About</a></li>
      </ul>

      <div class="icons" aria-label="Social links">
        <!-- Instagram -->
        <a class="icon" href="https://www.instagram.com/steven_wilson_fine_art/" target="_blank" rel="noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <rect x="4" y="4" width="16" height="16" rx="4"></rect>
            <circle cx="12" cy="12" r="3.5"></circle>
            <circle cx="17.5" cy="6.5" r="1"></circle>
          </svg>
        </a>

        <!-- Email -->
        <a class="icon" href="mailto:stevenrwilson7@icloud.com" aria-label="Email">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M4 7h16v10H4z"></path>
            <path d="M4 7l8 6 8-6"></path>
          </svg>
        </a>

        <!-- Facebook search link -->
        <a class="icon" href="https://www.facebook.com/search/top?q=steven%20wilson%20art" target="_blank" rel="noreferrer" aria-label="Facebook">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M14 8h3V5h-3c-2.2 0-4 1.8-4 4v2H7v3h3v7h3v-7h3l1-3h-4V9c0-.6.4-1 1-1z"></path>
          </svg>
        </a>
      </div>
    </section>
  </main>

  <script>
    // Simple crossfade slideshow
    const slides = Array.from(document.querySelectorAll('.slide'));
    let i = 0;

    setInterval(() => {
      slides[i].classList.remove('active');
      i = (i + 1) % slides.length;
      slides[i].classList.add('active');
    }, 6500);
  </script>
</body>
</html>
