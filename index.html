<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Steve Wilson — Original Paintings</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.72);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: #111;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      align-items: center;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1400ms ease;
      transform: scale(1.02);
    }
    .slide.is-active { opacity: 1; }

    /* Dim overlay
       If you want it DIMMER: increase these opacities a bit (e.g., .38→.45, .58→.65, .66→.72)
       If you want it BRIGHTER: decrease them a bit.
    */
    .overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(90% 80% at 20% 40%, rgba(0,0,0,.38), rgba(0,0,0,.58) 55%, rgba(0,0,0,.66)),
        linear-gradient(to bottom, rgba(0,0,0,.28), rgba(0,0,0,.48));
      pointer-events: none;
    }

    .content {
      position: relative;
      width: min(520px, 92vw);
      margin-left: clamp(20px, 6vw, 72px);
      padding-top: clamp(120px, 18vh, 220px);
      padding-bottom: 64px;
    }

    .name {
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(56px, 7vw, 86px);
      line-height: 0.95;
      margin: 0 0 10px 0;
      letter-spacing: 0.02em;
      text-rendering: geometricPrecision;
    }

    .tagline {
      margin: 0 0 26px 2px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: lowercase;
      font-size: 14px;
    }

    .nav {
      margin-top: 10px;
      display: grid;
      gap: 14px;
    }
    .nav a{
      color: var(--text);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.20em;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
      width: fit-content;
      padding: 2px 0;
      border-bottom: 1px solid transparent;
    }
    .nav a:hover { border-bottom-color: rgba(255,255,255,.45); }

    .icons {
      margin-top: 18px;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .icon {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: rgba(255,255,255,.92);
      text-decoration: none;
      opacity: .9;
    }
    .icon:hover { opacity: 1; transform: translateY(-1px); }
    .icon svg { width: 22px; height: 22px; }

    footer {
      position: absolute;
      left: clamp(20px, 6vw, 72px);
      bottom: 18px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    @media (max-width: 520px){
      .nav { gap: 12px; }
      .icon { width: 30px; height: 30px; }
      .icon svg { width: 24px; height: 24px; }
    }
  </style>
</head>

<body>
  <main class="hero">
    <!-- Studio.jpg first and ONLY used on home -->
    <div class="slide is-active" style="background-image:url('Studio.jpg')"></div>
    <div class="slide" style="background-image:url('Cumberland.jpg')"></div>
    <div class="slide" style="background-image:url('Breckenridge.jpg')"></div>
    <div class="slide" style="background-image:url('Keeneland.jpg')"></div>

    <div class="overlay"></div>

    <section class="content" aria-label="Site navigation">
      <h1 class="name">Steve Wilson</h1>
      <p class="tagline">original paintings</p>

      <nav class="nav">
        <a href="paintings.html">Paintings</a>
        <a href="prints.html">Prints &amp; Commissions</a>
        <a href="exhibitions.html">Exhibitions</a>
        <a href="galleries.html">Galleries</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>

      <div class="icons" aria-label="Social links">
        <a class="icon" href="https://www.instagram.com/steven_wilson_fine_art/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="6" y="6" width="12" height="12" rx="3"></rect>
            <circle cx="12" cy="12" r="3.2"></circle>
            <circle cx="16.6" cy="7.4" r="0.9" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>

        <a class="icon" href="mailto:stevenrwilson7@icloud.com" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M4 6h16v12H4z"></path>
            <path d="m4 7 8 6 8-6"></path>
          </svg>
        </a>

        <a class="icon" href="https://www.facebook.com/search/top?q=steven%20wilson%20art" target="_blank" rel="noopener" aria-label="Facebook">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M13.5 22v-8h2.7l.4-3h-3.1V9.1c0-.9.2-1.5 1.5-1.5h1.7V5c-.3 0-1.4-.1-2.7-.1-2.6 0-4.3 1.6-4.3 4.6V11H7v3h2.7v8h3.8z"/>
          </svg>
        </a>
      </div>
    </section>

    <footer>© Steve Wilson Studio</footer>
  </main>

  <script>
    const slides = Array.from(document.querySelectorAll('.slide'));
    let i = 0;
    const DURATION = 5200;

    setInterval(() => {
      slides[i].classList.remove('is-active');
      i = (i + 1) % slides.length;
      slides[i].classList.add('is-active');
    }, DURATION);
  </script>
</body>
</html>
