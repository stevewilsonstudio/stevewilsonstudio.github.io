<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steve Wilson Studio</title>

  <!-- Classic high-contrast serif (previous style) + clean sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --text:#ffffff;
      --muted:rgba(255,255,255,0.75);
      --dim:0.55;
      --pad:56px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      overflow:hidden;
      background:#000;
    }

    /* Background slideshow */
    .bg{
      position:fixed;
      inset:0;
      z-index:-2;
    }
    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(0,0,0,var(--dim));
      z-index:2;
    }

    .slide{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      opacity:0;
      transition: opacity 1300ms ease;
      transform: scale(1.03);
      z-index:1;
    }
    .slide.active{opacity:1}

    /* Layout */
    .content{
      height:100vh;
      padding:var(--pad);
      display:flex;
      align-items:flex-start;
    }

    .panel{
      max-width:520px;
      margin-top:34vh; /* lowered text block */
    }

    /* Name */
    .name{
      margin:0 0 14px 0;
      font-family:"Libre Bodoni", serif;
      font-style:italic;
      font-weight:300;
      font-size:clamp(52px,5.5vw,88px);
      letter-spacing:0.06em;   /* increased spacing */
      line-height:1.15;        /* more breathing room */
      white-space:nowrap;      /* keep on one line */
    }

    .welcome{
      margin:0 0 34px 2px;
      font-size:15px;
      color:var(--muted);
    }

    /* Navigation */
    .nav{
      list-style:none;
      padding:0;
      margin:0 0 36px 2px;
      display:flex;
      flex-direction:column;
      gap:20px;                /* more vertical space */
    }

    .nav a{
      text-decoration:none;
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:0.22em;   /* increased tracking */
      color:rgba(255,255,255,0.88);
    }

    .nav a:hover{
      color:#ffffff;
    }

    /* Icons */
    .icons{
      display:flex;
      gap:20px;
      margin-left:2px;
      align-items:center;
    }

    .icon{
      width:30px;
      height:30px;
      display:inline-block;
      opacity:0.9;
    }

    .icon:hover{opacity:1}

    svg{
      width:30px;
      height:30px;
      stroke:rgba(255,255,255,0.92);
      stroke-width:1.7;
      fill:none;
    }

    /* Responsive */
    @media (max-width:700px){
      :root{--pad:28px}
      .panel{margin-top:30vh}
      .nav{gap:18px}
    }
  </style>
</head>

<body>

  <!-- Background images -->
  <div class="bg">
    <div class="slide active" style="background-image:url('Cumberland.jpg')"></div>
    <div class="slide" style="background-image:url('Breckenridge.jpg')"></div>
    <div class="slide" style="background-image:url('Keeneland.jpg')"></div>
  </div>

  <main class="content">
    <section class="panel">
      <h1 class="name">Steve Wilson</h1>
      <p class="welcome">Welcome to my studio website.</p>

      <ul class="nav">
        <li><a href="paintings.html">Paintings</a></li>
        <li><a href="prints.html">Prints</a></li>
        <li><a href="workshops.html">Workshops &amp; Exhibitions</a></li>
        <li><a href="galleries.html">Galleries</a></li>
        <li><a href="about.html">About</a></li>
      </ul>

      <div class="icons">
        <!-- Instagram -->
        <a class="icon" href="https://www.instagram.com/steven_wilson_fine_art/" target="_blank">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="4"/>
            <circle cx="12" cy="12" r="3.5"/>
            <circle cx="17.5" cy="6.5" r="1"/>
          </svg>
        </a>

        <!-- Email -->
        <a class="icon" href="mailto:stevenrwilson7@icloud.com">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h16v10H4z"/>
            <path d="M4 7l8 6 8-6"/>
          </svg>
        </a>

        <!-- Facebook -->
        <a class="icon" href="https://www.facebook.com/search/top?q=steven%20wilson%20art" target="_blank">
          <svg viewBox="0 0 24 24">
            <path d="M14 8h3V5h-3c-2.2 0-4 1.8-4 4v2H7v3h3v7h3v-7h3l1-3h-4V9c0-.6.4-1 1-1z"/>
          </svg>
        </a>
      </div>
    </section>
  </main>

  <script>
    const slides = document.querySelectorAll('.slide');
    let i = 0;
    setInterval(() => {
      slides[i].classList.remove('active');
      i = (i + 1) % slides.length;
      slides[i].classList.add('active');
    }, 6500);
  </script>

</body>
</html>
