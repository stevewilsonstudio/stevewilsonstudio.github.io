<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Steve Wilson</title>

  <!-- Fonts: close to the Svob vibe (high-contrast serif italic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --nav-letter-spacing: .22em;
      --nav-line-height: 2.25rem;
    }

    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #fff;
      background: #0b0f14;
      overflow-x: hidden;
    }

    /* Background slideshow layers */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: #0b0f14;
    }
    .bg::after{
      content:"";
      position: absolute;
      inset: 0;
      /* dim + a touch of contrast like Svob */
      background: linear-gradient(
        90deg,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.35) 40%,
        rgba(0,0,0,0.25) 100%
      );
      z-index: 2;
      pointer-events: none;
    }
    .bg-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1200ms ease-in-out;
      transform: scale(1.02);
      z-index: 1;
    }
    .bg-slide.is-active { opacity: 1; }

    /* Left column menu */
    .wrap{
      height: 100%;
      display: flex;
      align-items: center; /* center vertically */
      padding: clamp(18px, 3vw, 48px);
    }
    .menu{
      max-width: 520px;
      margin-left: clamp(10px, 3vw, 32px);
    }

    .name{
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 400;
      letter-spacing: .02em;
      line-height: 0.95;
      font-size: clamp(54px, 7.2vw, 92px);
      margin: 0 0 10px 0;
      /* Make sure it never gets clipped */
      padding-top: 6px;
    }

    .welcome{
      margin: 0 0 22px 2px;
      font-size: 15px;
      opacity: .85;
    }

    nav a{
      display: block;
      color: rgba(255,255,255,0.92);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: var(--nav-letter-spacing);
      line-height: var(--nav-line-height);
      font-size: 13px;
      margin: 4px 0;
      transition: opacity .18s ease, transform .18s ease;
    }
    nav a:hover{
      opacity: 1;
      transform: translateX(2px);
    }

    .icons{
      display: flex;
      gap: 14px;
      margin-top: 20px;
      align-items: center;
    }
    .icon-link{
      display: inline-flex;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.92);
      opacity: .9;
      transition: opacity .18s ease, transform .18s ease;
    }
    .icon-link:hover{ opacity: 1; transform: translateY(-1px); }
    .icon-link svg{ width: 26px; height: 26px; fill: currentColor; }

    .footer{
      position: fixed;
      left: 26px;
      bottom: 18px;
      font-size: 12px;
      opacity: .75;
    }

    /* Mobile adjustments */
    @media (max-width: 560px){
      .wrap{ align-items: flex-start; padding-top: 42px; }
      .footer{ left: 18px; bottom: 14px; }
      nav a{ line-height: 2.1rem; }
    }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="bg-slide is-active" id="slideA"></div>
    <div class="bg-slide" id="slideB"></div>
  </div>

  <div class="wrap">
    <div class="menu">
      <h1 class="name">Steve Wilson</h1>
      <p class="welcome">Welcome to my studio website.</p>

      <nav>
        <a href="paintings.html">paintings</a>
        <a href="prints.html">prints &amp; commissions</a>
        <a href="exhibitions.html">workshops &amp; exhibitions</a>
        <a href="galleries.html">galleries</a>
        <a href="about.html">about</a>
        <a href="contact.html">contact</a>
      </nav>

      <div class="icons">
        <a class="icon-link" href="https://www.instagram.com/steven_wilson_fine_art/" target="_blank" rel="noopener" aria-label="Instagram">
          <!-- Instagram -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9z"/><path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/><path d="M17.6 6.3a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2z"/></svg>
        </a>

        <a class="icon-link" href="mailto:stevenrwilson7@icloud.com" aria-label="Email">
          <!-- Mail -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/></svg>
        </a>

        <a class="icon-link" href="https://www.facebook.com/search/top?q=steven%20wilson%20art" target="_blank" rel="noopener" aria-label="Facebook">
          <!-- Facebook -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 22v-8h2.7l.4-3H13.5V9.1c0-.9.3-1.5 1.6-1.5h1.7V5c-.3 0-1.4-.1-2.7-.1-2.7 0-4.5 1.6-4.5 4.6V11H7v3h2.6v8h3.9z"/></svg>
        </a>
      </div>
    </div>
  </div>

  <div class="footer">© Steve Wilson Studio</div>

  <script>
    // Home page slideshow: Studio first, then Cumberland/Breckenridge/Keeneland
    const images = [
      "Studio.jpg",
      "Cumberland.jpg",
      "Breckenridge.jpg",
      "Keeneland.jpg"
    ];

    const slideA = document.getElementById("slideA");
    const slideB = document.getElementById("slideB");

    let active = slideA;
    let next = slideB;
    let idx = 0;

    function setBg(el, file){
      el.style.backgroundImage = `url('${file}')`;
    }

    // Start: Studio first (and visible immediately)
    setBg(active, images[0]);
    active.classList.add("is-active");
    idx = 1;

    // Crossfade every 7 seconds
    setInterval(() => {
      setBg(next, images[idx % images.length]);
      next.classList.add("is-active");
      active.classList.remove("is-active");

      // swap
      [active, next] = [next, active];
      idx++;
    }, 7000);
  </script>
</body>
</html>
