<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steve Wilson Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --overlay: rgba(0,0,0,.42);
      --menuText: rgba(255,255,255,.94);
      --menuSoft: rgba(255,255,255,.78);
      --pad: clamp(18px, 4vw, 56px);
      --ls-nav: 0.28em;
      --line-gap: 14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:#000;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}

    .bg{
      position:fixed; inset:0; z-index:-2; background:#000;
    }
    .bg-slide{
      position:absolute; inset:0;
      background-size:cover; background-position:center;
      opacity:0; transition:opacity 1400ms ease-in-out;
      transform:scale(1.03);
    }
    .bg-slide.active{opacity:1}

    .overlay{
      position:fixed; inset:0; z-index:-1;
      background:
        linear-gradient(90deg, rgba(0,0,0,.56) 0%, rgba(0,0,0,.30) 45%, rgba(0,0,0,.22) 100%),
        var(--overlay);
    }

    .wrap{
      height:100%;
      padding: 0 var(--pad);
      display:flex;
      align-items:center;
    }
    .left{
      width:min(520px, 90vw);
      transform: translateY(8vh); /* push down so name is not cut off */
    }

    .name{
      margin:0 0 10px 0;
      font-family:"Libre Bodoni", serif;
      font-style:italic;
      font-weight:300;
      font-size: clamp(56px, 7.2vw, 92px);
      line-height:.92;
      letter-spacing:.02em;
      color:var(--menuText);
      white-space:nowrap;
      text-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    .welcome{
      margin:0 0 22px 2px;
      font-size:14px;
      color:var(--menuSoft);
      letter-spacing:.02em;
      text-shadow: 0 10px 24px rgba(0,0,0,.35);
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap: var(--line-gap);
      margin-top: 10px;
    }
    .nav a{
      color:var(--menuSoft);
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing: var(--ls-nav);
      font-size:14px;
      width:fit-content;
    }
    .nav a:hover{color:#fff}

    .icons{
      margin-top: 22px;
      display:flex;
      gap: 14px;
      align-items:center;
    }
    .icon{
      width: 28px; height: 28px;
      opacity:.92;
      transition: opacity .15s ease, transform .15s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .icon:hover{opacity:1; transform: translateY(-1px)}
    .icon svg{
      width: 28px; height: 28px;
      fill: rgba(255,255,255,.92);
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.35));
    }

    .footer{
      position:fixed;
      left: var(--pad);
      bottom: 18px;
      font-size: 12px;
      color: rgba(255,255,255,.62);
      letter-spacing:.03em;
      text-shadow: 0 10px 22px rgba(0,0,0,.35);
    }

    @media (max-width: 650px){
      .name{white-space:normal}
      .left{transform: translateY(6vh)}
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true">
    <!-- FIRST image on load -->
    <div class="bg-slide active" style="background-image:url('Studio.jpg')"></div>
    <div class="bg-slide" style="background-image:url('Cumberland.jpg')"></div>
    <div class="bg-slide" style="background-image:url('Breckenridge.jpg')"></div>
    <div class="bg-slide" style="background-image:url('Keeneland.jpg')"></div>
  </div>
  <div class="overlay"></div>

  <div class="wrap">
    <div class="left">
      <h1 class="name">Steve Wilson</h1>
      <p class="welcome">Welcome to my studio website.</p>

      <nav class="nav" aria-label="Site navigation">
        <a href="paintings.html">Paintings</a>
        <a href="prints.html">Prints and Commissions</a>
        <a href="exhibitions.html">Exhibitions</a>
        <a href="galleries.html">Galleries</a>
        <a href="about.html">About</a>
      </nav>

      <div class="icons" aria-label="Social links">
        <!-- Instagram -->
        <a class="icon" href="https://www.instagram.com/steven_wilson_fine_art/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm9 2h-9A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9A3.5 3.5 0 0 0 20 16.5v-9A3.5 3.5 0 0 0 16.5 4zm.75 2.25a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
          </svg>
        </a>

        <!-- Email -->
        <a class="icon" href="mailto:stevenrwilson7@icloud.com" aria-label="Email">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/>
          </svg>
        </a>

        <!-- Facebook -->
        <a class="icon" href="https://www.facebook.com/search/top?q=steven%20wilson%20art" target="_blank" rel="noopener" aria-label="Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13.5 22v-8h2.7l.4-3h-3.1V9.2c0-.9.3-1.6 1.6-1.6H16.7V5a22 22 0 0 0-2.4-.1c-2.4 0-4 1.5-4 4.1V11H7.7v3h2.6v8h3.2z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <div class="footer">© <span id="y"></span> Steve Wilson Studio</div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const slides = Array.from(document.querySelectorAll('.bg-slide'));
    let i = 0;
    setInterval(() => {
      slides[i].classList.remove('active');
      i = (i + 1) % slides.length;
      slides[i].classList.add('active');
    }, 6500);
  </script>
</body>
</html>
